# Closes T-03.5-01 and T-03.5-20.
#
# The triggering run's SHA and artifact are untrusted data. The verifier checks
# out validator code from the trusted default branch, binds the artifact to the
# Actions API record, and parses only the allowlisted JSON evidence.
#
# It cannot run inside `ci` itself: it asserts the run's `conclusion`, and a job
# cannot observe its own run's conclusion while that run is still in progress.
# Hence `workflow_run`, which fires once `ci` has completed.
name: verify hosted evidence

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  verify-hosted-evidence:
    name: bind hosted evidence to its run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only successful producer runs need evidence validation.
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      # Never check out workflow_run.head_sha: it may be controlled by a fork.
      # workflow_run workflows execute the default-branch version; pin checkout
      # to that trusted branch and disable credential persistence.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: main
          persist-credentials: false

      - name: Download evidence and query the triggering run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          mkdir -p hosted-evidence
          # Artifacts are data only. Do not execute or source files from the
          # triggering run. Missing evidence from a successful run must fail.
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name mac-ordinary-evidence --dir hosted-evidence
          test -s hosted-evidence/ordinary-verification-evidence.json
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,workflowName,event,headBranch,headSha,status,conclusion,url,jobs \
            > hosted-evidence/run-view.json
          if [ "$RUN_EVENT" = pull_request ]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "missing PR identity for pull_request run" >&2; exit 1; }
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[].filename' > hosted-evidence/changed-files.txt
            test -s hosted-evidence/changed-files.txt
          else
            : > hosted-evidence/changed-files.txt
          fi

      - name: Validate ordinary evidence against trusted run identity
        run: |
          set -euo pipefail
          python3 playstead-mac/scripts/ci/verify-hosted-evidence.py \
            --run-view hosted-evidence/run-view.json \
            --manifest hosted-evidence/ordinary-verification-evidence.json \
            --changed-files hosted-evidence/changed-files.txt
