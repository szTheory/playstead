name: Protected macOS Virtual HID qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virtual-hid-qualification:
    if: github.repository == 'szTheory/playstead' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    environment:
      name: playstead-hid
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout trusted dispatch SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate signing inputs and run entitled Virtual HID test
        id: qualify
        env:
          PLAYSTEAD_CI_BUILD_ROOT: ${{ runner.temp }}/playstead-mac-ci
          PLAYSTEAD_HID_CERT_P12_BASE64: ${{ secrets.PLAYSTEAD_HID_CERT_P12_BASE64 }}
          PLAYSTEAD_HID_CERT_P12_PASSWORD: ${{ secrets.PLAYSTEAD_HID_CERT_P12_PASSWORD }}
          PLAYSTEAD_HID_PROFILE_BASE64: ${{ secrets.PLAYSTEAD_HID_PROFILE_BASE64 }}
        run: bash playstead-mac/scripts/ci/virtual-hid-signing.sh install-and-run

      - name: Bind sanitized evidence to this GitHub run
        id: manifest
        if: always() && steps.qualify.outputs.sanitized == 'true'
        run: >-
          python3 playstead-mac/scripts/ci/virtual-hid-evidence.py
          --sanitized-dir "$RUNNER_TEMP/playstead-mac-ci/entitled-virtual-gamepad/sanitized"
          --output "$RUNNER_TEMP/playstead-mac-ci/entitled-virtual-gamepad/sanitized/virtual-hid-manifest.json"

      - name: Remove temporary signing material
        if: always()
        env:
          PLAYSTEAD_CI_BUILD_ROOT: ${{ runner.temp }}/playstead-mac-ci
        run: bash playstead-mac/scripts/ci/virtual-hid-signing.sh cleanup

      - name: Upload sanitized Virtual HID evidence
        if: always() && steps.qualify.outputs.sanitized == 'true' && steps.manifest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: virtual-hid-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/playstead-mac-ci/entitled-virtual-gamepad/sanitized/entitled-gamepad.json
            ${{ runner.temp }}/playstead-mac-ci/entitled-virtual-gamepad/sanitized/ui-tests.json
            ${{ runner.temp }}/playstead-mac-ci/entitled-virtual-gamepad/sanitized/virtual-hid-manifest.json
          if-no-files-found: error
          retention-days: 7
