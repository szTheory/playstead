name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: playstead-server

jobs:
  # Every push and PR: the same gate as `mix precommit` locally — compile
  # with warnings as errors, formatting, and the full test suite including
  # the headless-Chrome browser contract suite and the real-transaction
  # sync tests. ~3-4 minutes.
  test:
    name: mix precommit (unit + LiveView + browser + integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: playstead_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # The recovery integration test invokes pg_dump from the runner. Keep
      # its client major aligned with the PostgreSQL 17 service above; the
      # Ubuntu image's default pg_dump is 16 and refuses to dump a 17 server.
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<'EOF'
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: noble-pgdg
          Architectures: amd64
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version | grep -F "17."

      # Cheap, dependency-free guard (no toolchain needed): every phase
      # UAT file's Summary footer must agree with its own body, or this
      # fails closed before any real work starts (plan 03-14). Runs from
      # the repo root, not `playstead-server` (this job's default
      # working-directory) — the UAT files it checks live under
      # `.planning/`, one level up.
      - name: UAT tally footers match their own bodies
        working-directory: .
        run: bash scripts/check-uat-tally.sh

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: playstead-server/.tool-versions
          version-type: strict

      - id: chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce  # v1.7.3
        with:
          chrome-version: stable
          install-chromedriver: true

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            playstead-server/deps
            playstead-server/_build
          key: mix-${{ runner.os }}-${{ hashFiles('playstead-server/.tool-versions') }}-${{ hashFiles('playstead-server/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('playstead-server/.tool-versions') }}-

      - run: mix deps.get
      - run: mix assets.setup

      - run: mix precommit
        env:
          WALLABY_CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}

      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: wallaby-screenshots
          path: playstead-server/tmp/wallaby_screenshots
          if-no-files-found: ignore

      - name: Working tree is clean after the build
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  # Ordinary four-layer macOS verification. This job is deliberately unfiltered: a
  # push or pull request may change a server/client contract without touching
  # the Mac directory, so path filtering would make the evidence vacuous. The
  # virtual-gamepad entitlement test remains blocked until a trusted lane is
  # provisioned; the ordinary job still publishes its explicit status.
  mac-verification:
    name: macOS ordinary unit + rendering + UI + live server
    runs-on: macos-26
    timeout-minutes: 60
    needs: [test, compose-smoke]
    if: always()
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      LINUX_TEST_CONCLUSION: ${{ needs.test.result }}
      LINUX_COMPOSE_CONCLUSION: ${{ needs.compose-smoke.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: playstead-server/.tool-versions
          version-type: strict

      # Static contract guards run BEFORE the ~20-minute build so drift between a
      # guard and the code it guards fails in seconds. Until this step existed,
      # CI invoked exactly one harness flag and reached none of these guards, so
      # two of them had silently drifted out of agreement with shipped code.
      - name: Verify static contract guards
        working-directory: playstead-mac
        run: scripts/ci/run-mac-verification.sh --self-test-contracts

      - name: Run no-HID ordinary native layers
        working-directory: playstead-mac
        run: scripts/ci/run-mac-verification.sh --run-unprivileged-verification

      - name: Upload sanitized ordinary Mac evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mac-ordinary-evidence
          path: playstead-mac/.build/ci/ordinary-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Upload sanitized ordinary Mac failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mac-ordinary-failure-evidence
          path: playstead-mac/.build/ci/ordinary-failure-evidence
          # A wrapper/setup failure can precede bundle creation. Preserve the
          # original failing step instead of replacing it with an artifact error.
          if-no-files-found: warn
          retention-days: 7

  # Entitled virtual-gamepad verification remains blocked/not-configured. This
  # public pull-request workflow uses fresh GitHub-hosted runners only. Any
  # future entitled lane must run from a trusted protected event without
  # checking out or executing untrusted pull-request code, and needs a matching
  # Apple Development profile before it can report a pass.

  # Independent Linux recovery claim. This job owns its throwaway Compose
  # target; no endpoint, handoff, volume, CA, or raw output crosses to macOS.
  recovery-fixture:
    name: Linux isolated recovery fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: playstead-server/.tool-versions
          version-type: strict

      - name: Resolve server dependencies
        working-directory: playstead-server
        run: mix deps.get

      - name: Compile recovery task and dependencies
        working-directory: playstead-server
        run: mix compile --warnings-as-errors

      - name: Verify privacy and lifecycle contracts
        run: |
          bash playstead-server/scripts/tests/recovery-fixture-test.sh
          bash playstead-server/scripts/tests/recovery-retained-target-test.sh
          bash playstead-mac/scripts/ci/tests/sanitizer-test.sh
          bash playstead-server/scripts/ci/recovery-fixture.sh --self-test

      - id: restore
        name: Run isolated restore fixture
        run: |
          mkdir -p "$RUNNER_TEMP/recovery-input"
          chmod 700 "$RUNNER_TEMP/recovery-input"
          timeout 20m bash playstead-server/scripts/ci/recovery-fixture.sh --output "$RUNNER_TEMP/recovery-input/evidence"

      - id: sanitize
        name: Sanitize recovery evidence
        if: ${{ always() && (steps.restore.outcome == 'success' || steps.restore.outcome == 'failure') }}
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
        run: |
          bash playstead-mac/scripts/ci/sanitize-evidence.sh --input "$RUNNER_TEMP/recovery-input" --output "$RUNNER_TEMP/recovery-sanitized"
          case "$RESTORE_OUTCOME" in
            success)
              test -s "$RUNNER_TEMP/recovery-sanitized/recovery-e2e.json"
              test ! -e "$RUNNER_TEMP/recovery-sanitized/recovery-failure.json"
              ;;
            failure)
              test -s "$RUNNER_TEMP/recovery-sanitized/recovery-failure.json"
              test ! -e "$RUNNER_TEMP/recovery-sanitized/recovery-e2e.json"
              ;;
            *)
              echo "restore step did not reach a success or failure conclusion" >&2
              exit 1
              ;;
          esac

      - name: Upload sanitized Linux recovery evidence
        if: ${{ always() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: linux-recovery-evidence
          path: ${{ runner.temp }}/recovery-sanitized/recovery-*.json
          if-no-files-found: error
          retention-days: 7

  # Cold-start deployment proof (docker build + compose up from destroyed
  # volumes + restart). It is slow (~5 min) and only changes when the
  # deployment surface does, so it runs on main and on PRs that touch it.
  # This path has already caught two real Dockerfile regressions.
  compose-smoke:
    name: docker compose cold start
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - id: changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad  # v3.0.4
        with:
          filters: |
            infra:
              - 'playstead-server/Dockerfile'
              - 'playstead-server/docker-compose.yml'
              - 'playstead-server/docker-compose.ci.yml'
              - 'playstead-server/Caddyfile'
              - 'playstead-server/mix.lock'
              - 'playstead-server/rel/**'
              - 'playstead-server/config/**'
              - 'playstead-server/scripts/**'
              - 'playstead-server/priv/repo/migrations/**'
              - '.github/workflows/ci.yml'

      - if: github.ref == 'refs/heads/main' || steps.changes.outputs.infra == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - if: github.ref == 'refs/heads/main' || steps.changes.outputs.infra == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: playstead-server
          load: true
          tags: playstead-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - if: github.ref == 'refs/heads/main' || steps.changes.outputs.infra == 'true'
        name: Cold-start smoke (fresh volumes, restart, volume survival)
        env:
          CI: "true"
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
          PLAYSTEAD_HTTP_PORT: "8080"
          PLAYSTEAD_HTTPS_PORT: "8443"
        run: |
          # A throwaway .env with real (non-placeholder) secrets: the release
          # refuses to boot on the .env.example placeholders by design.
          POSTGRES_PASSWORD="ci-$(openssl rand -hex 12)"
          cat > .env <<ENV
          POSTGRES_USER=playstead
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=playstead
          DATABASE_URL=ecto://playstead:${POSTGRES_PASSWORD}@db/playstead
          SECRET_KEY_BASE=$(openssl rand -base64 64 | tr -d '\n')
          PHX_HOST=localhost
          PLAYSTEAD_SETUP_TOKEN=
          ENV
          bash scripts/compose-smoke.sh --fresh
