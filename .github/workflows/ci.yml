name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: playstead-server

jobs:
  # Every push and PR: the same gate as `mix precommit` locally — compile
  # with warnings as errors, formatting, and the full test suite including
  # the headless-Chrome browser contract suite and the real-transaction
  # sync tests. ~3-4 minutes.
  test:
    name: mix precommit (unit + LiveView + browser + integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17.2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: playstead_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # Cheap, dependency-free guard (no toolchain needed): every phase
      # UAT file's Summary footer must agree with its own body, or this
      # fails closed before any real work starts (plan 03-14). Runs from
      # the repo root, not `playstead-server` (this job's default
      # working-directory) — the UAT files it checks live under
      # `.planning/`, one level up.
      - name: UAT tally footers match their own bodies
        working-directory: .
        run: bash scripts/check-uat-tally.sh

      - name: Phase 04.7 summary coverage is classifiable
        working-directory: .
        run: |
          set -euo pipefail
          coverage_output="$(python3 -m unittest discover -s scripts/tests -p 'test_phase_summary_coverage.py' -v 2>&1)"
          printf '%s\n' "$coverage_output"
          printf '%s\n' "$coverage_output" | grep -Eq '^Ran [1-9][0-9]* tests?'
          python3 scripts/check-phase-summary-coverage.py --root .planning/phases/04.7-optional-game-artwork-and-metadata-sync

      - name: Server workflow contract (must discover tests)
        working-directory: .
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/playstead-mac/scripts/ci/tests/test_server_workflow_contract.py"
          contract_output="$(python3 -m unittest discover \
            -s "$GITHUB_WORKSPACE/playstead-mac/scripts/ci/tests" \
            -p 'test_server_workflow_contract.py' -v 2>&1)"
          printf '%s\n' "$contract_output"
          printf '%s\n' "$contract_output" | grep -Eq '^Ran [1-9][0-9]* tests?'

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: playstead-server/.tool-versions
          version-type: strict

      - id: chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce  # v1.7.3
        with:
          chrome-version: stable
          install-chromedriver: true

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            playstead-server/deps
            playstead-server/_build
          key: mix-v2-${{ runner.os }}-${{ runner.arch }}-test-${{ hashFiles('playstead-server/.tool-versions') }}-${{ hashFiles('playstead-server/mix.lock') }}
          restore-keys: |
            mix-v2-${{ runner.os }}-${{ runner.arch }}-test-${{ hashFiles('playstead-server/.tool-versions') }}-
            mix-${{ runner.os }}-${{ hashFiles('playstead-server/.tool-versions') }}-

      - run: mix deps.get
      - run: mix assets.setup

      - name: Prepare qualified decoder before packaged parser tests
        working-directory: .
        run: |
          set -euo pipefail
          decoder_evidence="$RUNNER_TEMP/playstead-media-decoder-test"
          decoder_image="$(PLAYSTEAD_MEDIA_DECODER_EVIDENCE_DIR="$decoder_evidence" bash playstead-server/scripts/prepare-media-decoder-image.sh)"
          printf 'PLAYSTEAD_MEDIA_DECODER_EVIDENCE_DIR=%s\n' "$decoder_evidence" >> "$GITHUB_ENV"
          printf 'PLAYSTEAD_MEDIA_DECODER_IMAGE=%s\n' "$decoder_image" >> "$GITHUB_ENV"

      - name: Phase 04.7 metadata protocol and exact ExUnit guard
        working-directory: playstead-server
        run: |
          set -euo pipefail
          scripts/tests/require-exunit-target-test.sh
          node scripts/ci/validate-metadata-protocol-decision.js --self-test
          scripts/ci/require-exunit-target.sh test/playstead/metadata_test.exs
          scripts/ci/require-exunit-target.sh test/playstead_web/controllers/api/v1/capabilities_controller_test.exs


      - name: Verify browser prerequisites and discovery
        env:
          WALLABY_CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          set -euo pipefail
          test -x "$WALLABY_CHROME_BINARY"
          test -x "$CHROMEDRIVER_PATH"
          "$CHROMEDRIVER_PATH" --version
          dirname "$CHROMEDRIVER_PATH" >> "$GITHUB_PATH"
          python3 ../playstead-mac/scripts/ci/discover-browser-tests.py test/playstead_web/browser

      - name: Match PostgreSQL dump client to the test service
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' \
            'Suites: noble-pgdg' 'Components: main' \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version | grep -Eq '^pg_dump \(PostgreSQL\) 17\.'
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - run: mix precommit
        env:
          WALLABY_CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}

      - name: Working tree is clean after the build
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  # Ordinary four-layer macOS verification. This job is deliberately unfiltered: a
  # push or pull request may change a server/client contract without touching
  # the Mac directory, so path filtering would make the evidence vacuous. The
  # public PR workflow deliberately has no self-hosted runner path.
  mac-verification:
    name: macOS ordinary unit + rendering + UI + live server
    runs-on: macos-26
    timeout-minutes: 90
    needs: [test, compose-smoke]
    if: ${{ !cancelled() }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PLAYSTEAD_GB_GBC_FIXTURE_REGISTRY: ${{ github.workspace }}/playstead-mac/.build/ci/gb-gbc-fixtures/fixtures.json
      LINUX_TEST_CONCLUSION: ${{ needs.test.result }}
      LINUX_COMPOSE_CONCLUSION: ${{ needs.compose-smoke.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: playstead-server/.tool-versions
          version-type: strict

      - name: Cache server dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            playstead-server/deps
            playstead-server/_build
          key: mix-v2-${{ runner.os }}-${{ runner.arch }}-mac_ci-${{ hashFiles('playstead-server/.tool-versions') }}-${{ hashFiles('playstead-server/mix.lock') }}
          restore-keys: |
            mix-v2-${{ runner.os }}-${{ runner.arch }}-mac_ci-${{ hashFiles('playstead-server/.tool-versions') }}-

      - name: Cache pinned Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            playstead-mac/.build/ci/SourcePackages
            playstead-mac/.build/ci/PackageCache
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode26.6-${{ hashFiles('playstead-mac/**/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode26.6-

      # Static contract guards run BEFORE the ~20-minute build so drift between a
      # guard and the code it guards fails in seconds. Until this step existed,
      # CI invoked exactly one harness flag and reached none of these guards, so
      # two of them had silently drifted out of agreement with shipped code.
      - name: Install static contract prerequisites
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
          fi
          rg --version

      - name: Prepare the hosted display for finite window geometry cases
        working-directory: playstead-mac
        run: swift scripts/ci/configure-test-display.swift

      - name: Verify static contract guards
        working-directory: playstead-mac
        run: scripts/ci/run-mac-verification.sh --self-test-contracts

      - name: Generate pinned self-authored GB/GBC fixtures
        working-directory: playstead-mac
        run: |
          umask 077
          python3 ../.planning/spikes/001-bios-free-gameplay/build_fixture.py --out .build/ci/gb-gbc-fixtures
          for fixture in gb-mbc1-8k gbc-mbc5-32k gbc-mbc3-rtc; do
            mkdir -p ".local/gb-gbc-spike/$fixture/screenshots"
            chmod 700 ".local/gb-gbc-spike/$fixture"
          done

      - name: Install pinned mGBA Qt runtime for cartridge continuity cases
        working-directory: playstead-mac
        run: scripts/ci/install-pinned-mgba-ci.sh

      - name: Download the qualified Linux decoder runtime
        if: ${{ needs.compose-smoke.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: media-decoder-runtime
          path: ${{ runner.temp }}/playstead-media-decoder-runtime

      - name: Qualify the owned decoder runtime before native checks
        if: ${{ needs.compose-smoke.result == 'success' }}
        timeout-minutes: 15
        working-directory: playstead-mac
        run: scripts/ci/hosted-decoder-runtime.sh start "$RUNNER_TEMP/playstead-media-decoder-runtime"

      - name: Run no-HID ordinary native layers
        working-directory: playstead-mac
        run: scripts/ci/run-mac-verification.sh --run-unprivileged-verification

      - name: Upload sanitized ordinary Mac evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mac-ordinary-evidence
          path: playstead-mac/.build/ci/ordinary-evidence/ordinary-verification-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload sanitized ordinary Mac failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mac-ordinary-failure-evidence
          path: playstead-mac/.build/ci/ordinary-failure-evidence
          # A wrapper/setup failure can precede bundle creation. Preserve the
          # original failing step instead of replacing it with an artifact error.
          if-no-files-found: warn
          retention-days: 7

      - name: Close only the run-owned decoder guest
        if: always()
        working-directory: playstead-mac
        run: scripts/ci/hosted-decoder-runtime.sh cleanup

  # Independent Linux recovery claim. This job owns its throwaway Compose
  # target; no endpoint, handoff, volume, CA, or raw output crosses to macOS.
  recovery-fixture:
    name: Linux isolated recovery fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: playstead-server/.tool-versions
          version-type: strict

      - name: Cache server dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            playstead-server/deps
            playstead-server/_build
          key: mix-v2-${{ runner.os }}-${{ runner.arch }}-dev-${{ hashFiles('playstead-server/.tool-versions') }}-${{ hashFiles('playstead-server/mix.lock') }}
          restore-keys: |
            mix-v2-${{ runner.os }}-${{ runner.arch }}-dev-${{ hashFiles('playstead-server/.tool-versions') }}-

      - name: Resolve server dependencies
        working-directory: playstead-server
        run: mix deps.get

      - name: Compile recovery task and dependencies
        working-directory: playstead-server
        run: mix compile --warnings-as-errors

      - name: Verify privacy and lifecycle contracts
        run: |
          bash playstead-server/scripts/tests/recovery-fixture-test.sh
          bash playstead-server/scripts/tests/recovery-retained-target-test.sh
          bash playstead-mac/scripts/ci/tests/sanitizer-test.sh
          bash playstead-server/scripts/ci/recovery-fixture.sh --self-test

      - name: Prepare qualified decoder for the isolated restore target
        working-directory: .
        run: |
          set -euo pipefail
          decoder_evidence="$RUNNER_TEMP/playstead-media-decoder-recovery"
          decoder_image="$(PLAYSTEAD_MEDIA_DECODER_EVIDENCE_DIR="$decoder_evidence" bash playstead-server/scripts/prepare-media-decoder-image.sh)"
          printf 'PLAYSTEAD_MEDIA_DECODER_EVIDENCE_DIR=%s\n' "$decoder_evidence" >> "$GITHUB_ENV"
          printf 'PLAYSTEAD_MEDIA_DECODER_IMAGE=%s\n' "$decoder_image" >> "$GITHUB_ENV"

      - name: Run isolated restore fixture
        run: |
          mkdir -m 700 "$RUNNER_TEMP/recovery-input"
          timeout 20m bash playstead-server/scripts/ci/recovery-fixture.sh --output "$RUNNER_TEMP/recovery-input/evidence"

      - name: Sanitize recovery evidence
        run: bash playstead-mac/scripts/ci/sanitize-evidence.sh --input "$RUNNER_TEMP/recovery-input" --output "$RUNNER_TEMP/recovery-sanitized"

      - name: Upload sanitized Linux recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: linux-recovery-evidence
          path: ${{ runner.temp }}/recovery-sanitized/recovery-e2e.json
          if-no-files-found: error
          retention-days: 7

  # Cold-start deployment proof (docker build + compose up from destroyed
  # volumes + restart). It runs on every PR and protected-main push so the
  # scanners and attestations always refer to the image that passed this smoke.
  compose-smoke:
    name: docker compose cold start
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MIX_ENV: test
    outputs:
      infra_changed: ${{ steps.changes.outputs.infra }}
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17.2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          version-file: playstead-server/.tool-versions
          version-type: strict

      - name: Cache server dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            playstead-server/deps
            playstead-server/_build
          key: mix-v2-${{ runner.os }}-${{ runner.arch }}-test-${{ hashFiles('playstead-server/.tool-versions') }}-${{ hashFiles('playstead-server/mix.lock') }}
          restore-keys: |
            mix-v2-${{ runner.os }}-${{ runner.arch }}-test-${{ hashFiles('playstead-server/.tool-versions') }}-

      - name: Resolve parser fixture test dependencies
        working-directory: playstead-server
        run: |
          mix deps.get
          mix assets.setup

      - name: Release evidence contract (must discover tests)
        working-directory: .
        run: |
          set -euo pipefail
          test -s scripts/tests/test_release_evidence.py
          contract_output="$(python3 -m unittest discover -s scripts/tests -p 'test_release_evidence.py' -v 2>&1)"
          printf '%s\n' "$contract_output"
          printf '%s\n' "$contract_output" | grep -Eq '^Ran [1-9][0-9]* tests?'

      - name: Decoder scan receipt contract (must discover tests)
        working-directory: .
        run: |
          set -euo pipefail
          test -s scripts/tests/test_wolfi_repo_proxy.py
          set +e
          relay_output="$(python3 -m unittest discover -s scripts/tests -p 'test_wolfi_repo_proxy.py' -v 2>&1)"
          relay_status=$?
          set -e
          printf '%s\n' "$relay_output"
          test "$relay_status" -eq 0
          printf '%s\n' "$relay_output" | grep -Eq '^Ran [1-9][0-9]* tests?'
          test -s scripts/tests/test_media_decoder_supply_chain.py
          set +e
          contract_output="$(python3 -m unittest discover -s scripts/tests -p 'test_media_decoder_supply_chain.py' -v 2>&1)"
          contract_status=$?
          set -e
          printf '%s\n' "$contract_output"
          test "$contract_status" -eq 0
          printf '%s\n' "$contract_output" | grep -Eq '^Ran [1-9][0-9]* tests?'

      - id: changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad  # v3.0.4
        with:
          filters: |
            infra:
              - 'playstead-server/Dockerfile'
              - 'playstead-server/docker-compose.yml'
              - 'playstead-server/docker-compose.ci.yml'
              - 'playstead-server/Caddyfile'
              - 'playstead-server/mix.lock'
              - 'playstead-server/rel/**'
              - 'playstead-server/config/**'
              - 'playstead-server/scripts/**'
              - 'playstead-server/priv/repo/migrations/**'
              - '.github/workflows/ci.yml'

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
        with:
          driver-opts: |
            image=public.ecr.aws/xqdo/hub/moby/buildkit@sha256:751921dc37d2f842de38c9387f891fe6ae7d80f03d050ea98f780d7e0874ba00

      - name: Build and scan the isolated media decoder before Compose activation
        working-directory: .
        env:
          PLAYSTEAD_MEDIA_DECODER_EVIDENCE_DIR: ${{ runner.temp }}/playstead-media-decoder-evidence
        run: |
          set -euo pipefail
          decoder_image="$(bash playstead-server/scripts/prepare-media-decoder-image.sh)"
          printf 'PLAYSTEAD_MEDIA_DECODER_IMAGE=%s\n' "$decoder_image" >> "$GITHUB_ENV"
          printf 'PLAYSTEAD_MEDIA_DECODER_EVIDENCE_DIR=%s\n' "$PLAYSTEAD_MEDIA_DECODER_EVIDENCE_DIR" >> "$GITHUB_ENV"

      - name: Export the qualified immutable decoder for native composition
        working-directory: .
        run: |
          set -euo pipefail
          runtime_artifact="$RUNNER_TEMP/playstead-media-decoder-runtime"
          mkdir -p "$runtime_artifact/generated"
          docker image save --output "$runtime_artifact/decoder-image.tar" "$PLAYSTEAD_MEDIA_DECODER_IMAGE"
          cp "$PLAYSTEAD_MEDIA_DECODER_EVIDENCE_DIR/decoder-scan-receipt.json" "$runtime_artifact/"
          cp "$PLAYSTEAD_MEDIA_DECODER_EVIDENCE_DIR/decoder-trivy.json" "$runtime_artifact/"
          cp -R playstead-server/ops/media-decoder/build/generated/. "$runtime_artifact/generated/"
          # Signing secrets stay in the ignored .build tree, never this public context.
          test -z "$(find "$runtime_artifact/generated" -type f -name '*.rsa' -print)"

      - name: Preserve the qualified public decoder runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: media-decoder-runtime
          path: ${{ runner.temp }}/playstead-media-decoder-runtime
          if-no-files-found: error
          retention-days: 7

      - name: Preserve decoder scan result, including policy failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: media-decoder-scan-evidence
          path: |
            ${{ runner.temp }}/playstead-media-decoder-evidence/decoder-scan-result.json
            ${{ runner.temp }}/playstead-media-decoder-evidence/decoder-trivy.json
            ${{ runner.temp }}/playstead-media-decoder-evidence/decoder-scan-receipt.json
          if-no-files-found: ignore
          retention-days: 14

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: playstead-server
          tags: playstead-app:ci
          outputs: type=docker,dest=/tmp/playstead-release.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Load the release archive used by the smoke test
        run: docker load --input /tmp/playstead-release.tar

      - name: Record tested release identity
        id: release
        run: |
          set -euo pipefail
          echo "sha256=$(sha256sum /tmp/playstead-release.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "image_id=$(docker image inspect --format '{{.Id}}' playstead-app:ci)" >> "$GITHUB_OUTPUT"

      - name: Cold-start smoke (fresh volumes, restart, volume survival)
        env:
          CI: "true"
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
          PLAYSTEAD_HTTP_PORT: "8080"
          PLAYSTEAD_HTTPS_PORT: "8443"
        run: |
          # A throwaway .env with real (non-placeholder) secrets: the release
          # refuses to boot on the .env.example placeholders by design.
          POSTGRES_PASSWORD="ci-$(openssl rand -hex 12)"
          cat > .env <<ENV
          POSTGRES_USER=playstead
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=playstead
          DATABASE_URL=ecto://playstead:${POSTGRES_PASSWORD}@db/playstead
          SECRET_KEY_BASE=$(openssl rand -base64 64 | tr -d '\n')
          PHX_HOST=localhost
          PLAYSTEAD_SETUP_TOKEN=
          ENV
          bash scripts/compose-smoke.sh --fresh

      - name: Scan tested image and validate release evidence
        working-directory: .
        env:
          RELEASE_ARCHIVE: ${{ runner.temp }}/playstead-release-evidence/playstead-release.tar
          RELEASE_SHA256: ${{ steps.release.outputs.sha256 }}
          RELEASE_IMAGE_REF: playstead-app:ci
        run: |
          mkdir -p "$RUNNER_TEMP/playstead-release-evidence"
          cp /tmp/playstead-release.tar "$RELEASE_ARCHIVE"
          bash playstead-server/scripts/parser-fixture-inventory.sh --output "$RUNNER_TEMP/playstead-release-evidence/parser-inventory.json" --subject-sha256 "$RELEASE_SHA256"
          bash scripts/ci/release-supply-chain.sh "$RUNNER_TEMP/playstead-release-evidence"

      - name: Upload tested archive and validated evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: tested-release-evidence
          path: |
            ${{ runner.temp }}/playstead-release-evidence/playstead-release.tar
            ${{ runner.temp }}/playstead-release-evidence/evidence.json
            ${{ runner.temp }}/playstead-release-evidence/scan-reports.json
            ${{ runner.temp }}/playstead-release-evidence/sbom.cdx.json
            ${{ runner.temp }}/playstead-media-decoder-evidence/decoder-scan-receipt.json
            ${{ runner.temp }}/playstead-media-decoder-evidence/decoder-trivy.json
            ${{ runner.temp }}/playstead-media-decoder-evidence/decoder-scan-result.json
          if-no-files-found: error
          retention-days: 14

  release-attestation:
    name: Protected-main release attestations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected == true
    needs: [test, compose-smoke]
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # actions/download-artifact v4.3.0 commit resolved from its official release ref:
      # https://github.com/actions/download-artifact/releases/tag/v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: tested-release-evidence
          path: release-evidence

      - name: Check downloaded tested archive and scan manifest
        run: |
          set -euo pipefail
          test -s release-evidence/playstead-release.tar
          test -s release-evidence/evidence.json
          test -s release-evidence/sbom.cdx.json
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('release-evidence')
          evidence = json.loads((root / 'evidence.json').read_text())
          digest = hashlib.sha256((root / 'playstead-release.tar').read_bytes()).hexdigest()
          if evidence['subject']['archive_sha256'] != digest:
              raise SystemExit('downloaded release archive digest differs from validated report')
          PY
          python3 scripts/ci/release-evidence.py --input release-evidence/evidence.json --output release-evidence/evidence-revalidated.json

      # Pin resolved from the official actions/attest v4.2.2 signed release (2026-10-09):
      # https://github.com/actions/attest/releases/tag/v4.2.2
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2 provenance
        with:
          subject-path: release-evidence/playstead-release.tar
      - id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2 CycloneDX SBOM
        with:
          subject-path: release-evidence/playstead-release.tar
          sbom-path: release-evidence/sbom.cdx.json

      - name: Verify provenance and SBOM attestations against archive digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify release-evidence/playstead-release.tar --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-ref refs/heads/main --format json > release-evidence/provenance-verified.json
          gh attestation verify release-evidence/playstead-release.tar --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-ref refs/heads/main --predicate-type https://cyclonedx.org/bom --format json > release-evidence/sbom-verified.json
          python3 scripts/ci/release-evidence.py --input release-evidence/evidence.json --provenance release-evidence/provenance-verified.json --sbom release-evidence/sbom-verified.json --output release-evidence/release-evidence.json

      - name: Upload verified release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-ready-evidence
          path: release-evidence/release-evidence.json
          if-no-files-found: error
          retention-days: 90
