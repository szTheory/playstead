services:
  db:
    image: postgres:17.2
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # THIS IS YOUR LIBRARY — never run `docker compose down -v`, it
      # destroys this volume and everything in it.
      - playstead_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PHX_HOST: ${PHX_HOST}
      PHX_SERVER: "true"
      PLAYSTEAD_SETUP_TOKEN: ${PLAYSTEAD_SETUP_TOKEN}
      PLAYSTEAD_INBOX_PATH: /app/inbox
      PLAYSTEAD_EXPORT_PATH: /app/exports
      PLAYSTEAD_IMPORT_CONCURRENCY: ${PLAYSTEAD_IMPORT_CONCURRENCY:-2}
      PLAYSTEAD_IMPORT_VERIFY: ${PLAYSTEAD_IMPORT_VERIFY:-true}
      PLAYSTEAD_MAX_BROWSER_UPLOAD_BYTES: ${PLAYSTEAD_MAX_BROWSER_UPLOAD_BYTES:-4294967296}
      PLAYSTEAD_MAX_UPLOAD_BYTES: ${PLAYSTEAD_MAX_UPLOAD_BYTES:-8589934592}
      PLAYSTEAD_MAX_SESSION_FILES: ${PLAYSTEAD_MAX_SESSION_FILES:-250000}
      PORT: "4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      # THIS IS YOUR LIBRARY — created now, unused until Phase 2. Never
      # run `docker compose down -v`, it destroys this volume.
      - playstead_blobs:/app/blobs
      # Read-only: lets Playstead.TlsTrust read Caddy's internal-CA root
      # certificate (D-13) to display its fingerprint on the Devices page
      # for pairing-time client pinning. The app never writes into this
      # volume — Caddy owns it exclusively.
      - caddy_data:/caddy_data:ro
      # D-01: a self-hoster stages files for import by copying them into
      # this host folder. `:ro` is load-bearing, not decorative — it
      # makes "your source file stays where it is" a kernel guarantee
      # rather than an application-code promise.
      - ./inbox:/app/inbox:ro
      # D-33: where exported folders are written. Genuinely writable —
      # unlike the inbox, export jobs cannot proceed without it.
      - ./exports:/app/exports
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    environment:
      # Compose's ${VAR:-default} treats an unset AND an empty
      # PLAYSTEAD_DOMAIN the same way, falling back to "localhost".
      # Caddy's own {$VAR:default} Caddyfile syntax does NOT — it only
      # falls back for a truly unset variable, and docker compose
      # always sets a listed environment key (to "" if unset at the
      # host), so passing PLAYSTEAD_DOMAIN through directly would hand
      # Caddy an explicitly-empty site address and fail to parse.
      CADDY_SITE_ADDRESS: ${PLAYSTEAD_DOMAIN:-localhost}
    ports:
      - "${PLAYSTEAD_HTTP_PORT:-80}:80"
      - "${PLAYSTEAD_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  playstead_db:
  playstead_blobs:
  caddy_data:
  caddy_config:
