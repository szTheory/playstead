# The default is the canonical stack.  An isolated recovery proof must set a
# newly generated PLAYSTEAD_COMPOSE_PROJECT and preflight it before Compose is
# allowed to create project-scoped networks or named volumes.
name: ${PLAYSTEAD_COMPOSE_PROJECT:-playstead}

services:
  db:
    image: postgres:17.2
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # THIS IS YOUR LIBRARY — never run `docker compose down -v`, it
      # destroys this volume and everything in it.
      - playstead_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PHX_HOST: ${PHX_HOST}
      PHX_SERVER: "true"
      PLAYSTEAD_SETUP_TOKEN: ${PLAYSTEAD_SETUP_TOKEN}
      PLAYSTEAD_INBOX_PATH: /app/inbox
      PLAYSTEAD_EXPORT_PATH: /app/exports
      PLAYSTEAD_IMPORT_CONCURRENCY: ${PLAYSTEAD_IMPORT_CONCURRENCY:-2}
      PLAYSTEAD_IMPORT_VERIFY: ${PLAYSTEAD_IMPORT_VERIFY:-true}
      PLAYSTEAD_MAX_BROWSER_UPLOAD_BYTES: ${PLAYSTEAD_MAX_BROWSER_UPLOAD_BYTES:-4294967296}
      PLAYSTEAD_MAX_UPLOAD_BYTES: ${PLAYSTEAD_MAX_UPLOAD_BYTES:-8589934592}
      PLAYSTEAD_MAX_SESSION_FILES: ${PLAYSTEAD_MAX_SESSION_FILES:-250000}
      PLAYSTEAD_MEDIA_DECODER_SOCKET: /run/playstead-media/decoder.sock
      PLAYSTEAD_MEDIA_DECODER_REQUIRED: "true"
      PORT: "4000"
    depends_on:
      db:
        condition: service_healthy
      media-decoder:
        condition: service_healthy
    group_add: ["11001"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      # THIS IS YOUR LIBRARY — created now, unused until Phase 2. Never
      # run `docker compose down -v`, it destroys this volume.
      - playstead_blobs:/app/blobs
      # Read-only: lets Playstead.TlsTrust read Caddy's internal-CA root
      # certificate (D-13) to display its fingerprint on the Devices page
      # for pairing-time client pinning. The app never writes into this
      # volume — Caddy owns it exclusively.
      - caddy_data:/caddy_data:ro
      # D-01: a self-hoster stages files for import by copying them into
      # this host folder. `:ro` is load-bearing, not decorative — it
      # makes "your source file stays where it is" a kernel guarantee
      # rather than an application-code promise.
      - ${PLAYSTEAD_INBOX_HOST_PATH:-./inbox}:/app/inbox:ro
      # D-33: where exported folders are written. Genuinely writable —
      # unlike the inbox, export jobs cannot proceed without it.
      - ${PLAYSTEAD_EXPORT_HOST_PATH:-./exports}:/app/exports
      - media_decoder_socket:/run/playstead-media
    restart: unless-stopped

  # One shared, bounded decoder service. It receives only staged request
  # bytes over this socket; it has no database, canonical blob, or secret mount.
  media-decoder:
    image: ${PLAYSTEAD_MEDIA_DECODER_IMAGE:?Run scripts/verified-compose.sh up to build and scan the decoder before activation}
    network_mode: none
    read_only: true
    user: "11001:11001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./ops/media-decoder/seccomp.json
    pids_limit: 32
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    volumes:
      - media_decoder_socket:/run/playstead-media
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/playstead-media/decoder.sock'); s.close()"]
      interval: 2s
      timeout: 1s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    environment:
      # Compose's ${VAR:-default} treats an unset AND an empty
      # PLAYSTEAD_DOMAIN the same way, falling back to "localhost".
      # The optional explicit site address supports a LAN IP served by
      # Caddy's internal CA while PLAYSTEAD_DOMAIN stays empty, keeping
      # Playstead's TLS readiness state truthful. Ordinary deployments
      # still fall back to PLAYSTEAD_DOMAIN or localhost.
      CADDY_SITE_ADDRESS: ${PLAYSTEAD_CADDY_SITE_ADDRESS:-${PLAYSTEAD_DOMAIN:-localhost}}
      CADDY_HTTP_PORT: ${PLAYSTEAD_HTTP_PORT:-80}
      CADDY_HTTPS_PORT: ${PLAYSTEAD_HTTPS_PORT:-443}
    ports:
      - "${PLAYSTEAD_BIND_ADDRESS:-0.0.0.0}:${PLAYSTEAD_HTTP_PORT:-80}:${PLAYSTEAD_HTTP_PORT:-80}"
      - "${PLAYSTEAD_BIND_ADDRESS:-0.0.0.0}:${PLAYSTEAD_HTTPS_PORT:-443}:${PLAYSTEAD_HTTPS_PORT:-443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  playstead_db:
  playstead_blobs:
  caddy_data:
  caddy_config:
  media_decoder_socket:
