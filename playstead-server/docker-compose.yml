services:
  db:
    image: postgres:17.2
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # THIS IS YOUR LIBRARY — never run `docker compose down -v`, it
      # destroys this volume and everything in it.
      - playstead_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PHX_HOST: ${PHX_HOST}
      PHX_SERVER: "true"
      PLAYSTEAD_SETUP_TOKEN: ${PLAYSTEAD_SETUP_TOKEN}
      PORT: "4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      # THIS IS YOUR LIBRARY — created now, unused until Phase 2. Never
      # run `docker compose down -v`, it destroys this volume.
      - playstead_blobs:/app/blobs
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    environment:
      PLAYSTEAD_DOMAIN: ${PLAYSTEAD_DOMAIN}
    ports:
      - "${PLAYSTEAD_HTTP_PORT:-80}:80"
      - "${PLAYSTEAD_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  playstead_db:
  playstead_blobs:
  caddy_data:
  caddy_config:
