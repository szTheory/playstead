# CI override: run the compose smoke against the image the workflow just
# built (with the GitHub Actions layer cache) instead of rebuilding.
#   COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml scripts/compose-smoke.sh --fresh
services:
  app:
    image: ${PLAYSTEAD_APP_IMAGE:-playstead-app:ci}
    build: !reset null
    volumes:
      # Mirrors docker-compose.yml's Phase 2 mounts so CI exercises the
      # same inbox/exports shape as a real deploy.
      - playstead_blobs:/app/blobs
      - caddy_data:/caddy_data:ro
      - ./inbox:/app/inbox:ro
      - ./exports:/app/exports
